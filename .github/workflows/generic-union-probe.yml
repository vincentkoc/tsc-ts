name: Native artifact restoration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-restoration-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_SHA: a80cd9190942d16286a8483f1f51d9a68037324f
  EXPECTED_NATIVE_SHA256: 9785e87da1650d3a4007d234bc194c63b640524c010497884e4b93161c7bb149

jobs:
  native:
    if: github.repository == 'vincentkoc/tsc-ts'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_HEAD: ${{ github.sha }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = a186687b0b23e4b6718be8daac197c82ae38017c
          echo '5789f5d900e63da7a53167886af620a0ee290c0543add7eebc0f28c1f4c93049  package-lock.json' | sha256sum --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Install frozen dependencies
        run: |
          test "$(node --version)" = v24.21.0
          test "$(npm --version)" = 11.19.0
          npm ci
          test "$(node -p 'require("./node_modules/scriptc/package.json").version')" = 0.3.5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: scriptc
        with:
          path: ~/.cache/scriptc
          key: scriptc-Linux-0.3.5
      - name: Record producer inputs
        env:
          SCRIPTC_CACHE_HIT: ${{ steps.scriptc.outputs.cache-hit }}
        run: |
          mkdir -p restoration
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          const hash = bytes => createHash("sha256").update(bytes).digest("hex");
          const file = name => {
            const stat = fs.lstatSync(name);
            assert(stat.isFile() && stat.size <= 512 * 1024 * 1024, "nonregular or oversized input");
            return { bytes: stat.size, sha256: hash(fs.readFileSync(name)) };
          };
          const cacheRoot = path.join(os.homedir(), ".cache/scriptc");
          const cacheManifest = [];
          let cacheBytes = 0;
          let entries = 0;
          const walk = (directory, prefix = "") => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true }).sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0)) {
              assert(++entries <= 8192, "cache inventory limit");
              const relative = prefix + entry.name;
              const name = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(name, relative + "/");
              else {
                const identity = file(name);
                cacheBytes += identity.bytes;
                assert(cacheBytes <= 8 * 1024 ** 3, "cache byte limit");
                cacheManifest.push({ name: relative, ...identity });
              }
            }
          };
          if (fs.existsSync(cacheRoot)) walk(cacheRoot);
          const scriptcPackage = "node_modules/@scriptc/cli-linux-x64-gnu/package.json";
          const scriptc = JSON.parse(fs.readFileSync(scriptcPackage));
          assert.equal(scriptc.version, "0.3.5");
          const scriptcBinary = file("node_modules/@scriptc/cli-linux-x64-gnu/dist/bin/scriptc");
          const installedScriptc = file("node_modules/scriptc/bin/scriptc.exe");
          assert.deepEqual(installedScriptc, scriptcBinary);
          const receipt = {
            sourceSha: process.env.SOURCE_SHA,
            sourceTree: "a186687b0b23e4b6718be8daac197c82ae38017c",
            lock: file("package-lock.json"),
            workflowSha: process.env.PROOF_WORKFLOW_SHA, workflowHead: process.env.PROOF_HEAD,
            runId: process.env.PROOF_RUN_ID, runAttempt: process.env.PROOF_RUN_ATTEMPT,
            runner: { imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion, kernel: os.release(), architecture: os.arch() },
            node: { version: process.version, ...file(process.execPath) },
            npm: { version: execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(), ...file(fs.realpathSync(execFileSync("which", ["npm"], { encoding: "utf8" }).trim())) },
            scriptc: { version: scriptc.version, package: file(scriptcPackage), binary: scriptcBinary, installedBinary: installedScriptc },
            cache: { key: "scriptc-Linux-0.3.5", hit: process.env.SCRIPTC_CACHE_HIT === "true", files: cacheManifest.length, bytes: cacheBytes, manifest: cacheManifest, manifestSha256: hash(JSON.stringify(cacheManifest)) },
            execution: { plannedScriptcBuilds: 2, producedCompilerExecutions: 0, dependencySetupHooks: "npm ci" },
            expectedNativeSha256: process.env.EXPECTED_NATIVE_SHA256,
            libraries: "External 108-library b13 manifest is independently restored; not bundled or requalified here.",
          };
          const serialized = JSON.stringify(receipt, null, 2) + "\n";
          assert(Buffer.byteLength(serialized) <= 2 * 1024 * 1024, "receipt byte limit");
          fs.writeFileSync("restoration/receipt.json", serialized);
          '
      # Preserve the original producer commands and join both workers before packaging.
      - name: Build the two native entries
        working-directory: packages/tsc-ts
        run: |
          npm run build:native > "$RUNNER_TEMP/tsc.log" 2>&1 &
          tsc=$!
          npx scriptc build src/drivers/cli.ts --optimization=speed --no-keep-llvm -o dist/cli > "$RUNNER_TEMP/cli.log" 2>&1 &
          cli=$!
          status=0
          wait $tsc || { status=1; cat "$RUNNER_TEMP/tsc.log"; }
          wait $cli || { status=1; cat "$RUNNER_TEMP/cli.log"; }
          exit $status
      - name: Package and record native identities
        run: |
          git diff --exit-code
          tar -cf restoration/native.tar packages/tsc-ts/dist/tsc packages/tsc-ts/dist/cli
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          const file = name => {
            const stat = fs.lstatSync(name);
            assert(stat.isFile() && stat.size > 0 && stat.size <= 64 * 1024 * 1024);
            return { bytes: stat.size, sha256: createHash("sha256").update(fs.readFileSync(name)).digest("hex") };
          };
          const receipt = JSON.parse(fs.readFileSync("restoration/receipt.json"));
          receipt.outputs = { tsc: file("packages/tsc-ts/dist/tsc"), cli: file("packages/tsc-ts/dist/cli"), tar: file("restoration/native.tar") };
          receipt.matchesQualifiedNative = receipt.outputs.tsc.sha256 === receipt.expectedNativeSha256;
          fs.writeFileSync("restoration/receipt.json", JSON.stringify(receipt, null, 2) + "\n");
          console.log(JSON.stringify(receipt.outputs));
          '
      # Retain mismatch evidence before the identity gate; never promote different bytes.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-restoration
          path: |
            restoration/native.tar
            restoration/receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Require the qualified native identity
        run: |
          node -e 'const assert = require("node:assert/strict"); const receipt = require("./restoration/receipt.json"); assert.equal(receipt.outputs.tsc.sha256, process.env.EXPECTED_NATIVE_SHA256); assert.equal(receipt.matchesQualifiedNative, true);'
