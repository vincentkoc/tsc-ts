name: NoEmit exit contract proof

on:
  push:
    branches: [chore/uniform-union-proof-20261018]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify baseline producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/vincentkoc/tsc-ts/actions/runs/39095377483 > "$RUNNER_TEMP/producer.json"
          node -e '
            const assert = require("node:assert/strict");
            const run = require(process.argv[1]);
            assert.equal(run.head_sha, "032d5d8680e9a75bdfaa624cd830222603654103");
            assert.equal(run.run_attempt, 1);
            assert.equal(run.conclusion, "success");
            assert.equal(run.repository.full_name, "vincentkoc/tsc-ts");
          ' "$RUNNER_TEMP/producer.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 032d5d8680e9a75bdfaa624cd830222603654103
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: vincentkoc/tsc-ts
          run-id: 39095377483
          name: native
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
          digest-mismatch: error
      - name: Stage exact baseline and pinned libraries
        run: |
          test "$(git rev-parse HEAD)" = 032d5d8680e9a75bdfaa624cd830222603654103
          mkdir "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/producer.json" "$RUNNER_TEMP/evidence/"
          python3 <<'PY'
          import hashlib, os, pathlib, tarfile
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temporary / 'baseline/native.tar'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '9e84d8f792a56e9f4727bcc730a597f77429eb2a59f79af6edbc07ebf78a910c'
          with tarfile.open(archive) as tar:
              member = tar.getmember('packages/tsc-ts/dist/tsc')
              assert member.isfile() and member.size < 256 * 1024 * 1024
              binary = tar.extractfile(member).read()
          assert hashlib.sha256(binary).hexdigest() == '26f1a9ea2e9f3730e2f6127a23672a8b7dd33dc603a0494470a6108e3b2dd60b'
          destination = temporary / 'baseline/tsc'
          destination.write_bytes(binary)
          destination.chmod(0o755)
          PY
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-7.1.0-dev.20260928.1.tgz', { signal: AbortSignal.timeout(120000) });
          assert.equal(response.ok, true);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha512').update(bytes).digest('base64'), 'aURCjT15k41CKK0+rBGHptWXt+pzwzsgUpiQ8GBWIwUGTt3Q7VnKkMZQQz0WRNUKTqfsSfzmlXW59bTBJtN41Q==');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/pinned.tgz', bytes, { flag: 'wx' });
          JS
          mkdir "$RUNNER_TEMP/pinned"
          tar --no-same-owner -xzf "$RUNNER_TEMP/pinned.tgz" -C "$RUNNER_TEMP/pinned"
          mkdir -p upstream/typescript-go/internal/bundled
          ln -s "$RUNNER_TEMP/pinned/package/lib" upstream/typescript-go/internal/bundled/libs
          sha256sum "$RUNNER_TEMP/baseline/tsc" "$RUNNER_TEMP/pinned/package/lib/tsc" > "$RUNNER_TEMP/evidence/binaries.sha256"
          sha256sum "$RUNNER_TEMP/pinned/package/lib/"*.d.ts > "$RUNNER_TEMP/evidence/libraries.sha256"
          "$RUNNER_TEMP/baseline/tsc" --version | tee "$RUNNER_TEMP/evidence/baseline-version.txt"
          "$RUNNER_TEMP/pinned/package/lib/tsc" --version | tee "$RUNNER_TEMP/evidence/pinned-version.txt"
          grep -Fx 'Version 7.0.2' "$RUNNER_TEMP/evidence/baseline-version.txt"
          grep -Fx 'Version 7.1.0-dev.20260928.1' "$RUNNER_TEMP/evidence/pinned-version.txt"
      - name: Compare noEmit exit contract
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const temporary = process.env.RUNNER_TEMP;
          const url = 'https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-7.0.2.tgz';
          const response = await fetch(url, { signal: AbortSignal.timeout(120000) });
          assert.equal(response.ok, true);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha512').update(bytes).digest('base64'), 'EYdf2cNg7rgCWJnxCdJ+F3V39O8ihb37eHAu1LK8oAFizgTQbPOK7zHHXbPt8rX24COqODXeI3sIf0fCXG7H/A==');
          fs.writeFileSync(temporary + '/reference.tgz', bytes, { flag: 'wx' });
          fs.mkdirSync(temporary + '/reference');
          assert.equal(spawnSync('tar', ['--no-same-owner', '-xzf', temporary + '/reference.tgz', '-C', temporary + '/reference']).status, 0);
          const lib = temporary + '/pinned/package/lib';
          for (const file of fs.readdirSync(lib).filter(file => file.endsWith('.d.ts'))) {
            fs.copyFileSync(path.join(lib, file), temporary + '/reference/package/lib/' + file);
            fs.copyFileSync(path.join(lib, file), temporary + '/baseline/' + file);
          }
          const results = [];
          for (const [name, binary, expected] of [
            ['candidate', temporary + '/baseline/tsc', 1],
            ['reference', temporary + '/reference/package/lib/tsc', 1],
            ['pinned', lib + '/tsc', 2],
          ]) {
            for (const checkers of [1, 4]) {
              for (const incremental of [false, true]) {
                const cwd = temporary + '/case-' + name + '-' + checkers + '-' + incremental;
                fs.mkdirSync(cwd);
                fs.writeFileSync(cwd + '/index.ts', 'const value: string = 123;\n');
                fs.writeFileSync(cwd + '/tsconfig.json', JSON.stringify({
                  compilerOptions: { strict: true, noEmit: true, target: 'ES2022', types: [], incremental,
                    ...(incremental ? { tsBuildInfoFile: './cache.tsbuildinfo' } : {}) },
                  files: ['index.ts'],
                }));
                for (let repeat = 0; repeat < (incremental ? 2 : 1); repeat++) {
                  const args = ['-p', 'tsconfig.json', '--pretty', 'false', '--checkers', String(checkers)];
                  const r = spawnSync(binary, args, { cwd, encoding: 'utf8', timeout: 30000, env: { PATH: process.env.PATH } });
                  const row = { name, checkers, incremental, repeat, exit: r.status, signal: r.signal, stdout: r.stdout, stderr: r.stderr,
                    emitted: fs.readdirSync(cwd).filter(f => !['index.ts', 'tsconfig.json'].includes(f)) };
                  results.push(row);
                  fs.writeFileSync(temporary + '/evidence/noemit.json', JSON.stringify(results, null, 2));
                  assert.ifError(r.error);
                  assert.equal(r.status, expected, JSON.stringify(row));
                  assert.equal(r.stderr, '');
                  assert.equal(r.stdout, "index.ts(1,7): error TS2322: Type 'number' is not assignable to type 'string'.\n");
                  assert.deepEqual(row.emitted, incremental ? ['cache.tsbuildinfo'] : []);
                }
              }
            }
          }
          assert.equal(results.length, 18);
          console.log(JSON.stringify(results, null, 2));
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: noemit-contract-proof
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
