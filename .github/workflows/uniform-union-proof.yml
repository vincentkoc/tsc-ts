name: Pinned noEmit regression contract

on:
  push:
    branches: [chore/uniform-union-proof-20261018]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7e16d1e178b7d33b8382e93c8765f03b185358ac
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Stage pinned compiler and libraries
        run: |
          test "$(git rev-parse HEAD)" = 7e16d1e178b7d33b8382e93c8765f03b185358ac
          mkdir "$RUNNER_TEMP/evidence"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-7.1.0-dev.20260928.1.tgz', { signal: AbortSignal.timeout(120000) });
          assert.equal(response.ok, true);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha512').update(bytes).digest('base64'), 'aURCjT15k41CKK0+rBGHptWXt+pzwzsgUpiQ8GBWIwUGTt3Q7VnKkMZQQz0WRNUKTqfsSfzmlXW59bTBJtN41Q==');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/pinned.tgz', bytes, { flag: 'wx' });
          JS
          mkdir "$RUNNER_TEMP/pinned"
          tar --no-same-owner -xzf "$RUNNER_TEMP/pinned.tgz" -C "$RUNNER_TEMP/pinned"
          mkdir -p upstream/typescript-go/internal/bundled
          ln -s "$RUNNER_TEMP/pinned/package/lib" upstream/typescript-go/internal/bundled/libs
          sha256sum "$RUNNER_TEMP/pinned/package/lib/tsc" > "$RUNNER_TEMP/evidence/binary.sha256"
          sha256sum "$RUNNER_TEMP/pinned/package/lib/"*.d.ts > "$RUNNER_TEMP/evidence/libraries.sha256"
          "$RUNNER_TEMP/pinned/package/lib/tsc" --version | tee "$RUNNER_TEMP/evidence/version.txt"
          grep -Fx 'Version 7.1.0-dev.20260928.1' "$RUNNER_TEMP/evidence/version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/fixture-head.txt"
      - name: Validate upstream noEmit regression expectations
        run: |
          (cd packages/tsc-ts && TSC_TS_BIN="$RUNNER_TEMP/pinned/package/lib/tsc" node --test --test-reporter=tap tests/noemit.test.mjs) > "$RUNNER_TEMP/evidence/pinned.tap" 2>&1
          cat "$RUNNER_TEMP/evidence/pinned.tap"
          grep -Fx '# tests 4' "$RUNNER_TEMP/evidence/pinned.tap"
          grep -Fx '# pass 4' "$RUNNER_TEMP/evidence/pinned.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/evidence/pinned.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/evidence/pinned.tap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pinned-noemit-regressions
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
