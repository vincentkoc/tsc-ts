name: Deep relation contract proof

on:
  push:
    branches: [chore/uniform-union-proof-20261018]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify baseline producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/vincentkoc/tsc-ts/actions/runs/39093115080 > "$RUNNER_TEMP/producer.json"
          node -e '
            const assert = require("node:assert/strict");
            const run = require(process.argv[1]);
            assert.equal(run.head_sha, "73734dba98552bdb7d0d90735be3882e6bed7f63");
            assert.equal(run.run_attempt, 1);
            assert.equal(run.conclusion, "success");
            assert.equal(run.repository.full_name, "vincentkoc/tsc-ts");
          ' "$RUNNER_TEMP/producer.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 032d5d8680e9a75bdfaa624cd830222603654103
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: vincentkoc/tsc-ts
          run-id: 39093115080
          name: native
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
          digest-mismatch: error
      - name: Stage exact baseline and pinned libraries
        run: |
          test "$(git rev-parse HEAD)" = 032d5d8680e9a75bdfaa624cd830222603654103
          mkdir "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/producer.json" "$RUNNER_TEMP/evidence/"
          python3 <<'PY'
          import hashlib, os, pathlib, tarfile
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temporary / 'baseline/native.tar'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '53ba97e75e6ed9bd1fcf0a65657cac90cd47faf0dd5a2640d849b874948764b3'
          with tarfile.open(archive) as tar:
              member = tar.getmember('packages/tsc-ts/dist/tsc')
              assert member.isfile() and member.size < 256 * 1024 * 1024
              binary = tar.extractfile(member).read()
          assert hashlib.sha256(binary).hexdigest() == 'af98f58985560e692b54777caca9ec4e001f590a24d032655be41927c57bc50e'
          destination = temporary / 'baseline/tsc'
          destination.write_bytes(binary)
          destination.chmod(0o755)
          PY
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-7.1.0-dev.20260928.1.tgz', { signal: AbortSignal.timeout(120000) });
          assert.equal(response.ok, true);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert.equal(createHash('sha512').update(bytes).digest('base64'), 'aURCjT15k41CKK0+rBGHptWXt+pzwzsgUpiQ8GBWIwUGTt3Q7VnKkMZQQz0WRNUKTqfsSfzmlXW59bTBJtN41Q==');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/pinned.tgz', bytes, { flag: 'wx' });
          JS
          mkdir "$RUNNER_TEMP/pinned"
          tar --no-same-owner -xzf "$RUNNER_TEMP/pinned.tgz" -C "$RUNNER_TEMP/pinned"
          mkdir -p upstream/typescript-go/internal/bundled
          ln -s "$RUNNER_TEMP/pinned/package/lib" upstream/typescript-go/internal/bundled/libs
          sha256sum "$RUNNER_TEMP/baseline/tsc" "$RUNNER_TEMP/pinned/package/lib/tsc" > "$RUNNER_TEMP/evidence/binaries.sha256"
          sha256sum "$RUNNER_TEMP/pinned/package/lib/"*.d.ts > "$RUNNER_TEMP/evidence/libraries.sha256"
          "$RUNNER_TEMP/baseline/tsc" --version | tee "$RUNNER_TEMP/evidence/baseline-version.txt"
          "$RUNNER_TEMP/pinned/package/lib/tsc" --version | tee "$RUNNER_TEMP/evidence/pinned-version.txt"
          grep -Fx 'Version 7.0.2' "$RUNNER_TEMP/evidence/baseline-version.txt"
          grep -Fx 'Version 7.1.0-dev.20260928.1' "$RUNNER_TEMP/evidence/pinned-version.txt"
      - name: Compare pre-backport native and pinned 7.1
        run: |
          for checkers in 1 4; do
            for compiler in pinned baseline; do
              wrapper="$RUNNER_TEMP/run-$compiler-$checkers"
              case "$compiler" in
                baseline) binary="$RUNNER_TEMP/baseline/tsc" ;;
                pinned) binary="$RUNNER_TEMP/pinned/package/lib/tsc" ;;
              esac
              printf '#!/bin/sh\nexec "%s" "$@" --checkers %s\n' "$binary" "$checkers" > "$wrapper"
              chmod 755 "$wrapper"
              log="$RUNNER_TEMP/evidence/$compiler-$checkers.tap"
              set +e
              (cd packages/tsc-ts && TSC_TS_BIN="$wrapper" node --test --test-reporter=tap tests/recursion-relations.test.mjs) > "$log" 2>&1
              status=$?
              set -e
              cat "$log"
              if [ "$compiler" = baseline ]; then
                test "$status" -eq 1
                python3 - "$log" <<'PY'
          import collections, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          assert '# tests 2' in text and '# fail 2' in text and '# skipped 0' in text, text
          blocks = re.split(r'(?m)^not ok \d+ - deep relations with side state ([01])\n', text)
          assert len(blocks) == 5 and {blocks[1], blocks[3]} == {'0', '1'}, text
          controls = {
              'conditional-literal-control': 2322, 'shallow-recursive-mismatch': 2322,
              'mid-cycle-recursive-mismatch': 2322, 'finite-mapped-indexed-mismatch': 2322,
              'finite-mapped-intersection-mismatch': 2322, 'reverse-mapped-inference': 2322,
              'small-generic-assertion-control': 2352,
          }
          for block in [blocks[2], blocks[4]]:
              assert re.search(r"(?m)^  code: 'ERR_ASSERTION'$", block), block
              assert re.search(r"(?m)^  operator: 'strictEqual'$", block), block
              assert re.search(r'(?m)^  expected: 7$', block), block
              actual = re.search(r'(?m)^  actual: (\d+)$', block)
              assert actual and int(actual[1]) > 7, block
              found = collections.Counter((name, int(code)) for name, code in re.findall(r'([a-z-]+)\.ts\(\d+,\d+\): error TS(\d+):', block))
              assert sum(found.values()) == int(actual[1]), found
              for name, code in controls.items(): assert found[(name, code)] == 1, (name, found)
              extras = {key: count for key, count in found.items() if key not in {(name, code) for name, code in controls.items()}}
              assert extras and all(code == 2321 and name in {'deep-recursive-relations', 'deep-conditional-types', 'conditional-literal-control'} for name, code in extras), extras
              assert found[('deep-conditional-types', 2321)] > 0, found
          print('baseline retains the expected deep-relation errors and all negative controls')
          PY
              else
                test "$status" -eq 0
                grep -Fx '# tests 2' "$log"
                grep -Fx '# pass 2' "$log"
                grep -Fx '# skipped 0' "$log"
              fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: recursion-contract-proof
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
